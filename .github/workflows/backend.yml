name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobs" --health-interval 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://jobs:jobs@localhost:5432/jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply on real Postgres and match the models
        run: |
          alembic upgrade head
          alembic check
          python -m app.seed
          alembic downgrade base
      - name: Tests
        run: pytest -q
