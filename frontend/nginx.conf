# nginx для сайта: отдаёт собранные файлы из dist
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Файлы с хешем в имени (assets/index-a1b2c3.js) не меняются — браузер может хранить их год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Все остальные адреса (/search, /vacancies/12...) — это страницы React:
    # отдаём index.html, а нужную страницу выберет React Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
